# qingxiao skin bundle patch: inserts its public dsh.client entry into the web plugin roster.
# The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path-or-git-url>`; mutual exclusion between
# skins is managed by the home-layer disabled rows (same as other ui skins).
- insert:
    - id: ui-skin-qingxiao
      name: '@dsh-external/dsh-client-ui-skin-qingxiao'
